# ============================================================
#  SISTEMA DE GESTIÓN DE ALQUILERES DE DEPARTAMENTOS
#  Base de datos por defecto: H2 embebida (no requiere instalar)
# ============================================================
db.url=jdbc:h2:file:./data/alquileres;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
db.username=sa
db.password=
db.ddl.auto=true
db.ddl.script=schema.sql
db.seed.demo=true

